# Runs the same gate as `npm run check` on every push and pull request:
# lint, format, the unit tests and the Electron credential test.
# Windows, because NIMBUS is a Windows app and the credential test needs
# Electron's safeStorage (DPAPI).
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
