<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>NIMBUS</title>
  <style>
    :root {
      color-scheme: dark;
      --color-bg: #16141f;
      --color-surface: #1b1826;
      --color-divider: rgba(255, 255, 255, 0.08);
      --color-text: #f0eef7;
      --color-neutral-400: #8d8aa5;
      --color-accent-300: #b9acff;
      --color-accent-500: #8b78f5;
      --color-accent-700: #4a3f8a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Inter", system-ui, sans-serif;
      background: transparent;
    }
    .card {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, color-mix(in srgb, var(--color-accent-500) 14%, var(--color-bg)), var(--color-bg));
      border: 1px solid var(--color-accent-700);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--color-text);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      -webkit-app-region: drag;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-neutral-400);
      margin-bottom: 8px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-accent-500);
      box-shadow: 0 0 8px color-mix(in srgb, var(--color-accent-500) 70%, transparent);
      flex-shrink: 0;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .message {
      font-size: 12.5px;
      color: var(--color-neutral-400);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .actions-summary {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: auto;
      font-size: 12px;
      color: var(--color-text);
    }
    .actions-summary-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      -webkit-app-region: no-drag;
    }
    button {
      appearance: none;
      font-family: inherit;
      border-radius: 8px;
      font-size: 12.5px;
      padding: 7px 14px;
      cursor: pointer;
      border: 1px solid transparent;
      flex: 1;
    }
    .btn-primary {
      background: var(--color-accent-500);
      color: #0c0b13;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: var(--color-accent-300);
    }
    .btn-secondary {
      background: var(--color-surface);
      border-color: var(--color-divider);
      color: var(--color-text);
    }
    .btn-secondary:hover {
      border-color: var(--color-accent-500);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-dot"></span><span>NIMBUS</span></div>
    <div class="title" id="suggestionTitle"></div>
    <div class="message" id="suggestionMessage"></div>
    <div class="actions-summary" id="actionsSummary"></div>
    <div class="buttons">
      <button class="btn-primary" id="primaryBtn"></button>
      <button class="btn-secondary" id="secondaryBtn"></button>
    </div>
  </div>
  <script src="suggestionRenderer.js"></script>
</body>
</html>
