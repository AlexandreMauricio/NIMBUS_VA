<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>NIMBUS Timer</title>
    <link rel="stylesheet" href="nocturne.css" />
    <style>
      /* Tokens come from nocturne.css (linked above) — this window used
         to redeclare its own approximations of them. Only what is
         specific to a floating, rounded, transparent popup lives here. */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-body);
        background: transparent;
      }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(
          160deg,
          color-mix(in srgb, var(--color-accent-500) 14%, var(--color-bg)),
          var(--color-bg)
        );
        border: 1px solid var(--color-accent-700);
        border-radius: 14px;
        padding: 14px 16px;
        color: var(--color-text);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        -webkit-app-region: drag;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-neutral-400);
        align-self: flex-start;
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--color-accent-500);
        box-shadow: 0 0 8px color-mix(in srgb, var(--color-accent-500) 70%, transparent);
        flex-shrink: 0;
      }
      .timer-title {
        font-size: 13px;
        color: var(--color-neutral-400);
        margin-top: 6px;
      }
      .remaining {
        font-size: 30px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        margin-top: 4px;
      }
      .progress-track {
        width: 100%;
        height: 5px;
        border-radius: 999px;
        background: var(--color-divider);
        overflow: hidden;
        margin-top: 8px;
        /* The card is a column flex container, so without this the track
           is the first thing flex shrinks when content is tall — it was
           being crushed to 0px and disappearing entirely. */
        flex-shrink: 0;
      }
      .progress-fill {
        height: 100%;
        background: var(--color-accent-500);
        width: 0%;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        width: 100%;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }
      /* .btn/.btn-primary/.btn-secondary — including hover, active and
         focus-visible — come from nocturne.css. This window used to
         hand-roll its own versions, which had drifted from the system
         (a filled accent primary, which Nocturne explicitly rules out in
         favour of an accent outline). The only thing left here is the
         one popup-specific need: the pair splits the card's width. */
      /* Same adaptation styles.css makes for the main window: the
         system's .btn is written for <a class="btn">, so it leaves
         `appearance: auto` in place. On a real <button> that lets
         Windows paint its own grey control behind an outline variant
         that sets no background. This window doesn't load styles.css
         (it is deliberately self-contained), so it repeats the rule. */
      button.btn {
        appearance: none;
        background: transparent;
      }
      .buttons .btn {
        flex: 1;
      }
      /* A quieter second row: adding a study is a deliberate choice, not
         something to weigh equally with Pause/Stop. */
      .buttons-secondary-row {
        margin-top: 6px;
      }
      .buttons-secondary-row .btn {
        font-size: 12px;
      }
      .status {
        font-size: 11px;
        color: var(--color-neutral-400);
        margin-top: 8px;
        flex-shrink: 0;
        /* Empty while running, "Paused"/"Complete" otherwise. Reserving
           the line keeps the buttons from jumping when it appears. */
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand"><span class="brand-dot"></span><span>NIMBUS</span></div>
      <div class="timer-title" id="timerTitle"></div>
      <div class="remaining" id="remaining">--:--</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="buttons">
        <button class="btn btn-primary" id="pauseResumeBtn">Pause</button>
        <button class="btn btn-secondary" id="stopBtn">Stop</button>
      </div>
      <div class="buttons buttons-secondary-row">
        <button class="btn btn-ghost" id="addStudyBtn" title="Add one more study to today's plan">
          + Study
        </button>
      </div>
      <div class="status" id="statusText"></div>
    </div>
    <script src="timerRenderer.bundle.js"></script>
  </body>
</html>
